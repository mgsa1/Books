<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Character lab</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #E8DDC4; font-family: Baskerville, Georgia, serif; }
  .lab { position: fixed; transform: translate(-50%, 0); font: italic 15px Didot, Georgia, serif; color: #2B2118;
    background: rgba(239,230,210,.85); padding: 2px 8px; border: 1px solid #2B2118; white-space: nowrap; pointer-events: none; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head><body>
<script type="module">
import * as THREE from "three";
import { makeBlocky, makeChibiAlice, makeChibiRabbit, makePaper, makePixel, makeVoxel } from "./characters.js";
const params = new URLSearchParams(location.search);
const VIEW = Number(params.get("view") || 15);  // 15 = the game's zoom; smaller = close-up
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color("#E8DDC4");
scene.add(new THREE.HemisphereLight("#FFF8E8", "#7A7058", 1.8));
const sun = new THREE.DirectionalLight("#FFF4DE", 2.6); sun.position.set(15, 25, 10); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12 }); scene.add(sun);
// a patch of the game's ground
for (let x = -6; x <= 6; x++) for (let z = -4; z <= 4; z++) {
  const road = z === 0;
  const t = new THREE.Mesh(new THREE.BoxGeometry(1, 0.1, 1), new THREE.MeshLambertMaterial({ color: road ? "#D8C9A3" : "#93B06A", flatShading: true }));
  t.material.color.offsetHSL(0, 0, (((x * 73) ^ (z * 19)) % 10) / 300); t.position.set(x, 0.05, z); t.receiveShadow = true; scene.add(t);
}
const tree = new THREE.Mesh(new THREE.ConeGeometry(0.48, 1.3, 6), new THREE.MeshLambertMaterial({ color: "#5E8C4A", flatShading: true })); tree.position.set(-5, 1.25, -3); tree.castShadow = true; scene.add(tree);

const script = await fetch("../game/script.json").then((r) => r.json());
const C = Object.fromEntries(script.characters.map((c) => [c.id, c]));
const vox = async (id) => fetch(`../game/assets/voxel/${id}.json`, { cache: "no-cache" }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
const [vA, vR] = await Promise.all([vox("alice"), vox("white_rabbit")]);
const cast = [
  ["A · current", makeBlocky(C.alice), -5, 1.2], ["A · chibi", makeChibiAlice(), -3, 1.2], ["B · paper", makePaper("../game/assets/fullbody/alice.png", 1.3), -1, 1.2],
  ["C · pixel", makePixel("../game/assets/pixel/alice", 1.25), 1, 1.2],
  ["A · current", makeBlocky(C.white_rabbit), -5, -1.2], ["A · chibi", makeChibiRabbit(), -3, -1.2], ["B · paper", makePaper("../game/assets/fullbody/white_rabbit.png", 1.35), -1, -1.2],
  ["C · pixel", makePixel("../game/assets/pixel/white_rabbit", 1.3), 1, -1.2],
];
if (vA) cast.push(["D · voxel (Argon)", makeVoxel(vA, 1.3), 3, 1.2]);
if (vR) cast.push(["D · voxel (Argon)", makeVoxel(vR, 1.4), 3, -1.2]);
const labels = [];
for (const [name, obj, x, z] of cast) {
  obj.position.set(x, 0.1, z); obj.rotation.y = 0.35; scene.add(obj);
  const el = document.createElement("div"); el.className = "lab"; el.textContent = name; document.body.appendChild(el); labels.push([el, obj]);
}
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -100, 200);
const ISO = new THREE.Vector3(1, 1.25, 1).normalize().multiplyScalar(40);
const focus = new THREE.Vector3(Number(params.get("fx") || -1), 0.5, Number(params.get("fz") || 0));
function resize() { const a = innerWidth / innerHeight; Object.assign(camera, { left: -VIEW * a / 2, right: VIEW * a / 2, top: VIEW / 2, bottom: -VIEW / 2 }); camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); }
addEventListener("resize", resize); resize();
camera.position.copy(focus).add(ISO); camera.lookAt(focus);
const clock = new THREE.Clock(), v = new THREE.Vector3();
const walking = params.get("walk") === "1", spinning = params.get("spin") === "1";
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  for (const [, obj] of cast) {
    if (spinning) obj.rotation.y = 0.35 + t * 0.8;  // turn in place: pixel sprites swap views, 3D models rotate
    obj.userData.update?.(t, camera, walking);
    if (walking) obj.userData.legs?.forEach((l, i) => (l.rotation.x = Math.sin(t * 9) * 0.5 * (i ? 1 : -1)));
  }
  renderer.render(scene, camera);
  for (const [el, obj] of labels) { v.set(obj.position.x, -0.15, obj.position.z + 0.6).project(camera); el.style.left = (v.x + 1) / 2 * innerWidth + "px"; el.style.top = (1 - v.y) / 2 * innerHeight + "px"; }
});
setTimeout(() => (window.__ready = true), 1500);
</script></body></html>
